name: TTS Generate

on:
  workflow_dispatch:
    inputs:
      items:
        description: 'JSON array of per-item configs'
        type: string
        default: '[]'
      voice:
        description: 'Default voice'
        type: string
        default: 'af_sky'
      speed:
        description: 'Default speed (0.5 - 2.0)'
        type: string
        default: '1.0'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate speech
        uses: Shrawan13-glitch/tts-action@v1
        with:
          items: ${{ inputs.items }}
          voice: ${{ inputs.voice }}
          speed: ${{ inputs.speed }}

      - name: Upload audio
        uses: actions/upload-artifact@v4
        with:
          name: tts-audio
          path: tts-output/
